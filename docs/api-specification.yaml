openapi: 3.0.1
info:
  title: PayFlow Payment Orchestration API
  description: "Multi-gateway payment orchestration (Razorpay, Stripe, PayU, UPI)\
    \ with intelligent routing, 2-second failover, idempotency, webhook reconciliation\
    \ and a full audit trail. Amounts are integer paise."
  version: 1.0.0
servers:
- url: http://localhost
  description: Generated server url
security:
- apiKey: []
tags:
- name: Mock gateways
  description: Simulation controls used by the test harness (not for production)
- name: Reconciliation
  description: Reconciliation runs against gateway status and settlement data
- name: Routing
  description: "Routing algorithm weights and thresholds, stored in routing_config"
- name: Operations
  description: "DLQ, rate limiter, circuit breakers, anomalies, security events"
- name: Gateways
  description: "Configured gateways, circuit breaker health and performance metrics"
- name: Payments
  description: "Create, capture, void and refund payments"
- name: Webhooks
  description: "Gateway callbacks; authenticated by signature, not API key"
- name: Analytics
  description: Success rate and volume analytics
paths:
  /api/v1/routing/config:
    get:
      tags:
      - Routing
      summary: Current routing weights and thresholds (#17)
      operationId: get
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
        "409":
          description: Idempotency conflict or invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_STATE_TRANSITION:
                  value:
                    error:
                      code: INVALID_STATE_TRANSITION
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: "Invalid state transition CREATED -> REFUNDED ... Valid\
                        \ transitions from CREATED: [ABANDONED, FAILED, ROUTE_SELECTED]"
        "503":
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: The service is temporarily overloaded. Please retry
                        shortly.
        "422":
          description: Business rule violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_CAPTURE_AMOUNT:
                  value:
                    error:
                      code: INVALID_CAPTURE_AMOUNT
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: capture amount must be between 1 and the remaining
                        hold
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: payment 9f1c... not found
        "401":
          description: Missing/invalid API key or webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: A valid X-API-Key header is required.
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_FAILED:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: request validation failed
    put:
      tags:
      - Routing
      summary: Update routing weights / thresholds (#18)
      description: "Accepts {\"weights\": {\"success_rate\": 0.4, ...}} or flat keys.\
        \ The five weights must sum to 1.0."
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              type: string
              example:
                weights:
                  success_rate: 0.4
                  latency: 0.2
                  cost: 0.15
                  health: 0.15
                  method_fit: 0.1
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
        "409":
          description: Idempotency conflict or invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_STATE_TRANSITION:
                  value:
                    error:
                      code: INVALID_STATE_TRANSITION
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: "Invalid state transition CREATED -> REFUNDED ... Valid\
                        \ transitions from CREATED: [ABANDONED, FAILED, ROUTE_SELECTED]"
        "503":
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: The service is temporarily overloaded. Please retry
                        shortly.
        "422":
          description: Business rule violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
