                      message: capture amount must be between 1 and the remaining
                        hold
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  value:
                    error:
                      code: NOT_FOUND
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: payment 9f1c... not found
        "401":
          description: Missing/invalid API key or webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  value:
                    error:
                      code: UNAUTHORIZED
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: A valid X-API-Key header is required.
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_FAILED:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      details: {}
                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: request validation failed
components:
  schemas:
    GatewayConfigUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        supportedMethods:
          pattern: "^[A-Z,_ ]+$"
          type: string
        supportedCurrencies:
          pattern: "^[A-Z, ]+$"
          type: string
        feeBps:
          maximum: 10000
          type: integer
          format: int32
        fixedFeePaise:
          type: integer
          format: int64
        rateLimitPerSec:
          maximum: 10000
          type: integer
          format: int32
        rateLimitStrategy:
          pattern: TOKEN_BUCKET|SLIDING_WINDOW|RETRY_AFTER_BACKOFF
          type: string
        supportsPartialRefund:
          type: boolean
        authHoldDays:
          maximum: 30
          minimum: 0
          type: integer
          format: int32
        circuitPaymentMethod:
          pattern: ^(\*|CARD|UPI|NETBANKING|WALLET)$
          type: string
        circuitFailureThreshold:
          maximum: 1000
          type: integer
          format: int32
        circuitOpenTimeoutMs:
          type: integer
          format: int32
        circuitHalfOpenMaxRequests:
          maximum: 100
          type: integer
          format: int32
      example:
        enabled: true
        fee_bps: 190
        rate_limit_per_sec: 200
        circuit_failure_threshold: 5
        circuit_open_timeout_ms: 30000
        circuit_half_open_max_requests: 1
    ReconciliationRun:
      type: object
      properties:
        runId:
          type: string
        trigger:
          type: string
          enum:
          - SCHEDULED
          - MANUAL
        status:
          type: string
          enum:
          - RUNNING
          - COMPLETED
          - FAILED
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        scanned:
          type: integer
          format: int32
        stale:
          type: integer
          format: int32
        overridden:
          type: integer
          format: int32
        settled:
          type: integer
          format: int32
        anomalies:
          type: integer
          format: int32
    CreatePaymentRequest:
      required:
      - amountPaise
      - merchantOrderId
      - paymentMethod
      type: object
      properties:
        merchantOrderId:
          maxLength: 128
          minLength: 0
          pattern: "^[A-Za-z0-9._:/-]+$"
          type: string
          description: Merchant's order reference
          example: ORD-10045
        amountPaise:
          maximum: 99999999999
          type: integer
          description: "Amount in paise (₹1,200.00 = 120000)"
          format: int64
          example: 120000
        currency:
          pattern: "^[A-Za-z]{3}$"
          type: string
          description: "ISO-4217 currency, default INR"
          example: INR
        paymentMethod:
          type: string
          description: "CARD, UPI, NETBANKING or WALLET"
          example: CARD
        captureMode:
          type: string
          description: AUTOMATIC (default) captures right after authorisation; MANUAL
            waits for /capture
          example: AUTOMATIC
        upiFlow:
          type: string
          description: "UPI only: INTENT (default, instant) or COLLECT (customer approves\
            \ within 5 minutes)"
          example: COLLECT
      example:
        merchant_order_id: ORD-10045
        amount_paise: 120000
        currency: INR
        payment_method: CARD
        capture_mode: AUTOMATIC
    AmountRequest:
      type: object
      properties:
        amountPaise:
          type: integer
          description: Amount in paise; omit for the full remaining amount
          format: int64
          example: 80000
        reason:
          maxLength: 255
          minLength: 0
          type: string
          description: Refund reason (refunds only)
          example: customer returned item
      example:
        amount_paise: 80000
    Anomaly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
        transactionId:
          type: string
          format: uuid
        anomalyType:
          type: string
        internalState:
          type: string
        gatewayStatus:
          type: string
        severity:
          type: string
          enum:
          - WARNING
          - CRITICAL
        status:
          type: string
          enum:
          - OPEN
          - ACKNOWLEDGED
          - RESOLVED
        detail:
          type: string
        alerted:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Candidate:
      type: object
      properties:
        gateway:
          type: string
        score:
          type: number
          format: double
        health:
          type: string
          enum:
          - HEALTHY
          - DEGRADED
          - DOWN
        breakdown:
          type: object
          additionalProperties:
            type: object
    Decision:
      type: object
      properties:
        ranked:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        excluded:
          type: array
          items:
            $ref: "#/components/schemas/Exclusion"
        note:
          type: string
        empty:
          type: boolean
    Exclusion:
      type: object
      properties:
        gateway:
          type: string
        reason:
          type: string
    PaymentView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
        merchantOrderId:
          type: string
        amountPaise:
          type: integer
          format: int64
        amount:
          type: string
        currency:
          type: string
        paymentMethod:
          type: string
        captureMode:
          type: string
        upiFlow:
          type: string
        state:
          type: string
        gateway:
          type: string
        gatewayReference:
          type: string
        capturedPaise:
          type: integer
          format: int64
        remainingHoldPaise:
          type: integer
          format: int64
        releasedPaise:
          type: integer
          format: int64
        refundedPaise:
          type: integer
          format: int64
        attemptsMade:
          type: integer
          format: int32
        retryCount:
          type: integer
          format: int32
        nextRetryAt:
          type: string
          format: date-time
        failureCode:
          type: string
        failureReason:
          type: string
        traceId:
          type: string
          format: uuid
        authorisedAt:
          type: string
          format: date-time
        authExpiresAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
        settlementBatchId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransactionStateLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        fromState:
          type: string
          enum:
          - CREATED
          - ROUTE_SELECTED
          - AUTH_INITIATED
          - AUTHORISED
          - AUTH_FAILED
          - CAPTURE_INITIATED
          - CAPTURED
          - PARTIALLY_CAPTURED
          - CAPTURE_FAILED
          - REFUND_INITIATED
          - REFUNDED
          - FAILED
          - ABANDONED
          - VOID_INITIATED
          - VOIDED
          - AUTH_EXPIRED
          - SETTLED
          - PARTIALLY_REFUNDED
          - REFUND_FAILED
          - DISPUTE_OPENED
          - DISPUTE_RESOLVED
          - RECONCILIATION_MISMATCH
        toState:
          type: string
          enum:
          - CREATED
          - ROUTE_SELECTED
          - AUTH_INITIATED
          - AUTHORISED
          - AUTH_FAILED
          - CAPTURE_INITIATED
          - CAPTURED
          - PARTIALLY_CAPTURED
          - CAPTURE_FAILED
          - REFUND_INITIATED
          - REFUNDED
          - FAILED
          - ABANDONED
          - VOID_INITIATED
          - VOIDED
          - AUTH_EXPIRED
          - SETTLED
          - PARTIALLY_REFUNDED
          - REFUND_FAILED
          - DISPUTE_OPENED
          - DISPUTE_RESOLVED
          - RECONCILIATION_MISMATCH
        event:
          type: string
        gatewayReference:
          type: string
        gatewayResponse:
          type: object
          additionalProperties:
            type: object
        metadata:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
    GatewayRouteDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        attemptNo:
          type: integer
          format: int32
        gateway:
          type: string
        rank:
          type: integer
          format: int32
        score:
          type: number
          format: double
        selected:
          type: boolean
        healthStatus:
          type: string
        breakdown:
          type: object
          additionalProperties:
            type: object
        reason:
          type: string
        createdAt:
          type: string
          format: date-time
    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        amountPaise:
          type: integer
          format: int64
        gateway:
          type: string
        gatewayRefundId:
          type: string
        state:
          type: string
          enum:
          - INITIATED
          - PROCESSED
          - FAILED
        failureReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GatewayAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        gateway:
          type: string
        paymentMethod:
          type: string
          enum:
          - CARD
          - UPI
          - NETBANKING
          - WALLET
        operation:
          type: string
          enum:
          - AUTH
          - CAPTURE
          - REFUND
          - VOID
          - STATUS
        attemptNo:
          type: integer
          format: int32
        outcome:
          type: string
          enum:
          - SUCCESS
          - PENDING
          - DECLINED
          - TIMEOUT
          - UNREACHABLE
          - SERVER_ERROR
          - RATE_LIMITED
        latencyMs:
          type: integer
          format: int64
        httpStatus:
          type: integer
          format: int32
        errorCode:
          type: string
        createdAt:
          type: string
          format: date-time
    GatewayConfig:
      type: object
      properties:
        gatewayName:
          type: string
        displayName:
          type: string
        enabled:
          type: boolean
        supportedMethods:
          type: string
        supportedCurrencies:
          type: string
        feeBps:
          type: integer
          format: int32
        fixedFeePaise:
          type: integer
          format: int64
        authTimeoutMs:
          type: integer
          format: int32
        rateLimitPerSec:
          type: integer
          format: int32
        rateLimitStrategy:
          type: string
          enum:
          - TOKEN_BUCKET
          - SLIDING_WINDOW
          - RETRY_AFTER_BACKOFF
        supportsAuthCapture:
          type: boolean
        supportsPartialRefund:
          type: boolean
        authHoldDays:
          type: integer
          format: int32
        refundWindowDays:
          type: integer
          format: int32
        settlementCycle:
          type: string
        webhookSignatureScheme:
          type: string
        updatedAt:
          type: string
          format: date-time
    SecurityAuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventType:
          type: string
        gateway:
          type: string
        sourceIp:
          type: string
        userAgent:
          type: string
        requestPath:
          type: string
        detail:
          type: object
          additionalProperties:
            type: object
        createdAt:
          type: string
          format: date-time
    NotificationOutbox:
      type: object
      properties:
        id:
          type: integer
          format: int64
        transactionId:
          type: string
          format: uuid
        template:
          type: string
        payload:
          type: object
          additionalProperties:
            type: object
        status:
          type: string
          enum:
          - PENDING
          - SENT
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
    Alert:
      type: object
      properties:
        type:
          type: string
        severity:
          type: string
        message:
          type: string
        context:
          type: object
          additionalProperties:
            type: object
        at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: PAYMENT_AUTH_FAILED
            message:
              type: string
              example: Payment authorisation was declined by the issuing bank.
            details:
              type: object
              example: "{gateway_error_code=BAD_REQUEST_ERROR, suggestion=Please try\
                \ a different payment method or contact your bank., gateway=razorpay,\
                \ gateway_error_description=The card issuer has declined this transaction.}"
            request_id:
              type: string
              example: req_a1b2c3d4e5f6
            trace_id:
              type: string
              example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
            timestamp:
              type: string
              example: 2025-03-19T10:30:00.000Z
      description: A7.2 standard error format
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
