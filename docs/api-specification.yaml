                      timestamp: 2025-03-19T10:30:00.000Z
                      request_id: req_a1b2c3d4e5f6
                      message: payment 9f1c... not found
        "401":
          description: Missing/invalid API key or webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  value:
