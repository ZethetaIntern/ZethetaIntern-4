# PayFlow: `docker compose up` starts PostgreSQL 15, PgBouncer and the application.
# The app answers GET http://localhost:8080/api/v1/health once Flyway has migrated.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  # FS-14 / C5.4: connection multiplexing. Many application connections share a
  # small number of PostgreSQL server connections (transaction pooling mode).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: payflow
      DB_PASSWORD: payflow
      DB_NAME: payflow
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"

  app:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      # Runtime traffic goes through PgBouncer; prepared statements are disabled for transaction pooling.
      PAYFLOW_DB_URL: jdbc:postgresql://pgbouncer:6432/payflow
      PAYFLOW_DB_PREPARE_THRESHOLD: "0"
      # Flyway takes a session-level advisory lock, so migrations go straight to PostgreSQL.
      PAYFLOW_FLYWAY_URL: jdbc:postgresql://postgres:5432/payflow
      PAYFLOW_DB_USER: payflow
      PAYFLOW_DB_PASSWORD: payflow
      PAYFLOW_DB_POOL_SIZE: "20"
      PAYFLOW_API_KEY: pk_test_payflow
      PAYFLOW_RAZORPAY_WEBHOOK_SECRET: rzp_whsec_test
      PAYFLOW_STRIPE_WEBHOOK_SECRET: whsec_stripe_test
      PAYFLOW_PAYU_WEBHOOK_SALT: payu_salt_test
      PAYFLOW_MOCK_ENABLED: "true"
      # Optional read replica for reconciliation scans (FS-14):
      # PAYFLOW_REPLICA_URL: jdbc:postgresql://postgres-replica:5432/payflow
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseZGC"
    ports:
      - "8080:8080"
    healthcheck:
      # No curl in the JRE image: a raw HTTP request over bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/v1/health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \" 200 \"'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
