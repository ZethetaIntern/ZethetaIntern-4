services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/payflow
      PAYFLOW_DB_USER: payflow
      PAYFLOW_DB_PASSWORD: payflow
      PAYFLOW_API_KEY: pk_test_payflow
      PAYFLOW_WEBHOOK_SECRET: whsec_test_secret
    ports:
      - "8080:8080"
