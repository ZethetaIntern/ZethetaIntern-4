services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: payflow
      MYSQL_USER: payflow
      MYSQL_PASSWORD: payflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PAYFLOW_DB_URL: jdbc:mysql://mysql:3306/payflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYFLOW_DB_USER: payflow
      PAYFLOW_DB_PASSWORD: payflow
      PAYFLOW_API_KEY: pk_test_payflow
      PAYFLOW_WEBHOOK_SECRET: whsec_test_secret
    ports:
      - "8080:8080"
