spring:
  datasource:
    # Default: embedded H2 in PostgreSQL compatibility mode (dev/tests).
    # Production: run with --spring.profiles.active=postgres (see docker-compose.yml).
    url: ${PAYFLOW_DB_URL:jdbc:h2:mem:payflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${PAYFLOW_DB_USER:sa}
    password: ${PAYFLOW_DB_PASSWORD:}
    driver-class-name: ${PAYFLOW_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  flyway:
    enabled: false

springdoc:
  # OpenAPI 3.0.1 (swagger-core supported version) — matches docs/api-specification.yaml
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

payflow:
  api-key: ${PAYFLOW_API_KEY:pk_test_payflow}
  webhook-secret: ${PAYFLOW_WEBHOOK_SECRET:whsec_test_secret}
  attempt-timeout-millis: ${PAYFLOW_ATTEMPT_TIMEOUT_MS:2000}
  failover-timeout-millis: ${PAYFLOW_FAILOVER_TIMEOUT_MS:2000}
  max-gateway-attempts: ${PAYFLOW_MAX_ATTEMPTS:3}
  reconciliation-interval-ms: ${PAYFLOW_RECON_INTERVAL_MS:60000}

---
# Production profile: PostgreSQL 15+ (per project brief)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${PAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${PAYFLOW_DB_USER:payflow}
    password: ${PAYFLOW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
payflow:
  api-key: ${PAYFLOW_API_KEY}
  webhook-secret: ${PAYFLOW_WEBHOOK_SECRET}
